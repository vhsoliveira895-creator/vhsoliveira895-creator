<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellTech — exemplo HTML5</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="topo">
      <a href="#inicio">CellTech</a>
      <nav>
        <a href="#produtos">Produtos</a>
        <a href="#contato">Contato</a>
      </nav>
    </header>
    <main id="inicio">
      <h1>Acessórios para o seu celular</h1>
      <p>Página de prática com HTML semântico e CSS simples.</p>
    </main>
    <section id="produtos" class="produtos">
      <article class="card"><h2>Fone</h2><p>Bluetooth</p></article>
      <article class="card"><h2>Cabo</h2><p>USB-C</p></article>
    </section>
    <section id="contato">
      <h2>Contato</h2>
      <form>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required />
        <button type="submit">Enviar</button>
      </form>
    </section>
  </body>
</html>
